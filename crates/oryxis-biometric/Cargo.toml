[package]
name = "oryxis-biometric"
version = "0.1.0"
edition = "2024"

# Local app-unlock via the OS biometric / keystore. This is NOT SSH auth:
# it gates release of the vault master password from an OS-protected store
# behind a platform user-presence check (Windows Hello, macOS Touch ID, or
# the Linux login keyring). See `lib.rs` for the security model.
[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

# Linux (and other unixes that aren't macOS): the login keyring via the
# freedesktop Secret Service. No fingerprint API is standard on Linux, so
# this is "OS keystore gated by the login session", not real biometry; the
# app surfaces that honestly.
#
# 4.x split the crate into keyring-core plus pluggable stores; the `v1`
# feature is the same `Entry` API 3.x had, over the store this platform
# needs. Two reasons to be on it: 3.x reaches the Secret Service through
# zbus 4, the last thing in the tree pinning windows-sys 0.52, and the
# 4.x store is `secret_service::blocking`, the same no-async-runtime
# backend `sync-secret-service` gave us. Transport encryption stays
# pure-Rust (the store declares `crypto-rust` itself, so no libgcrypt).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1"] }

# Windows: Windows Hello (UserConsentVerifier) for the presence prompt +
# Credential Manager (per-user, DPAPI-backed) for the secret at rest.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
# windows-future 0.3 dropped the blocking `IAsyncOperation::get()`; the
# WinRT ops are `IntoFuture` now, so we drive them to completion on the
# calling (background) thread with a minimal blocking executor.
pollster = "0.4"
# `IAsyncOperation` lives in windows-future (the `windows` crate only
# re-exports `core`), and we must name it to annotate the interop
# `RequestVerificationForWindowAsync` return type. Cargo unifies this to
# the same 0.3.x the `windows` crate pulls.
windows-future = "0.3"

# macOS: the login Keychain for the secret at rest, LocalAuthentication
# (Touch ID / Apple Watch / login password) for the presence prompt that
# gates every read. The Security-framework functions are declared as
# externs against the stable C ABI directly (in `macos.rs`), so we only
# need Core Foundation for the CFString / CFData / CFDictionary plumbing.
#
# LocalAuthentication has no C ABI, so `LAContext` comes from the objc2
# family, which the macOS build already carries through winit. Cargo
# unifies these onto the objc2 0.6 / block2 0.6 / framework-crate 0.3
# versions in the lock, so nothing shared moves. The `evaluatePolicy`
# reply is a block, hence block2. Why this and not a SecAccessControl
# item (the entitlement it needs is restricted, so it wants a paid
# Developer Program membership) is documented in `macos.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSString",
] }
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "LAContext",
    "LAError",
] }

[dev-dependencies]
# Exercises the orchestrator against the in-memory mock provider.
