[package]
name = "oryxis-terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = { workspace = true }
vte = { workspace = true }
portable-pty = { workspace = true }
iced = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# User-defined highlight rules compile to regular expressions, including
# the plain-text ones (through `regex::escape`), so pattern matching has
# one implementation instead of two. The engine has no backtracking,
# which is what makes it safe to run a user's pattern over remote output.
regex = { workspace = true }
# No `arboard` here on purpose: this crate never touches the system
# clipboard itself. Every copy / paste is queued in `host_clipboard` and
# performed by the host through the iced runtime, so the process only ever
# has one clipboard operation in flight. See `host_clipboard` for the
# STATUS_HEAP_CORRUPTION crash that rule comes from.
# Character width for the inline IME preedit layout (CJK double-width
# cells); already in the tree via alacritty_terminal.
unicode-width = "0.2"

# `ShellExecuteW`, so Ctrl+click on a link reaches the OS handler without
# a shell in between. The `cmd /C start` shim it replaces let a byte the
# REMOTE HOST printed (`&`, `|`, `^`, `%VAR%`) act as a cmd.exe operator,
# because std quotes an argument only when it holds a space or tab and a
# scraped URL holds neither. See `widget::clipboard::open_url`.
# 0.61 is the line the rest of the tree resolves, so the build keeps one
# `windows-sys` (it numbers independently from `windows`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
